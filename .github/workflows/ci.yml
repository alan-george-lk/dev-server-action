name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule: [cron: 0 0 * * 1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
   test:
     name: Test (${{ matrix.os }})
     strategy:
       fail-fast: false
       matrix:
         os: [ubuntu-latest, windows-latest, macos-latest]
     runs-on: ${{ matrix.os }}
     steps:
       - name: Checkout
         uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
       - name: Run LiveKit server
         uses: ./
         with:
           github-token: ${{ github.token }}