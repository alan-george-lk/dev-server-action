name: LiveKit Dev Server
description: |
    Install and run a LiveKit server in development mode for end-to-end testing.
branding:
  icon: server
  color: blue
inputs:
  github-token:
    description: GitHub token
    required: true
  version:
    description: |
      livekit-server version to run: a release tag (e.g. v1.13.2) or a commit SHA
      from github.com/livekit/livekit. When empty, Linux and Windows use the latest
      release; macOS installs the current Homebrew formula.
    required: false
    default: ""
  config:
    description: Server configuration YAML
    required: false
    default: ""
outputs:
  pid:
    description: Process ID
    value: ${{ steps.start.outputs.pid }}
  log-path:
    description: Path to the server log file
    value: ${{ steps.start.outputs.log-path }}
runs:
   using: composite
   steps:
    - name: Resolve server version
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="${VERSION_INPUT//[[:space:]]/}"
        if [ -z "$version" ]; then
          if [ "${RUNNER_OS}" = "macOS" ]; then
            echo "mode=brew" >> "$GITHUB_OUTPUT"
            echo "Resolved livekit-server install mode: Homebrew (latest formula)"
            exit 0
          fi
          version="$(gh api repos/livekit/livekit/releases/latest --jq '.tag_name')"
          if [ -z "$version" ]; then
            echo "::error::Failed to resolve latest livekit-server release tag"
            exit 1
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "ref=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved livekit-server release: $version"
          exit 0
        fi

        if [[ "$version" =~ ^v[0-9] ]]; then
          if [ "${RUNNER_OS}" = "macOS" ]; then
            echo "mode=source" >> "$GITHUB_OUTPUT"
          else
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved livekit-server release: $version"
          exit 0
        fi

        if [[ "$version" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
          echo "mode=source" >> "$GITHUB_OUTPUT"
          echo "ref=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved livekit-server commit: $version"
          exit 0
        fi

        echo "::error::Invalid version '$version' (expected release tag like v1.13.2 or commit SHA)"
        exit 1

    - name: Brew install
      if: steps.resolve.outputs.mode == 'brew'
      shell: bash
      env:
        HOMEBREW_NO_ENV_HINTS: 1
      run: brew install livekit

    - name: Setup Go
      if: steps.resolve.outputs.mode == 'source'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: "1.26"
        cache: false

    - name: Build livekit-server from source
      if: steps.resolve.outputs.mode == 'source'
      shell: bash
      run: |
        set -euo pipefail
        ref="${{ steps.resolve.outputs.ref }}"
        src_dir="$RUNNER_TEMP/livekit-src"
        out="$RUNNER_TEMP/livekit-server"
        if [ "${RUNNER_OS}" = "Windows" ]; then
          out="$RUNNER_TEMP/livekit-server.exe"
        fi

        git clone https://github.com/livekit/livekit.git "$src_dir"
        pushd "$src_dir" >/dev/null
        if [[ "$ref" =~ ^v[0-9] ]]; then
          git fetch --depth 1 origin "refs/tags/${ref}:refs/tags/${ref}"
          git checkout "refs/tags/${ref}"
        else
          git fetch --depth 1 origin "$ref"
          git checkout "$ref"
        fi
        popd >/dev/null

        go build -o "$out" "$src_dir/cmd/server"
        if [ "${RUNNER_OS}" != "Windows" ]; then
          chmod +x "$out"
        fi
        "$out" --version

    - name: Download release artifact
      if: steps.resolve.outputs.mode == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)     suffix='linux_amd64.tar.gz' ;;
          Linux-ARM64)   suffix='linux_arm64.tar.gz' ;;
          Windows-X64)   suffix='windows_amd64.zip' ;;
          Windows-ARM64) suffix='windows_arm64.zip' ;;
          *) echo "Unsupported platform: ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        echo "::debug::Artifact suffix: $suffix"

        gh release download "${{ steps.resolve.outputs.ref }}" \
          --repo livekit/livekit \
          --pattern "*_${suffix}" \
          --output "$RUNNER_TEMP/release-archive"

        test -f "$RUNNER_TEMP/release-archive" || {
          echo "::error::Release artifact was not downloaded"
          exit 1
        }

    - name: Extract release artifact
      if: steps.resolve.outputs.mode == 'release'
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux) tar -xzf "$RUNNER_TEMP/release-archive" -C "$RUNNER_TEMP" && chmod +x "$RUNNER_TEMP/livekit-server" ;;
          Windows) unzip -o "$RUNNER_TEMP/release-archive" -d "$RUNNER_TEMP" ;;
        esac

    - name: Install yq (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install yq --no-progress -y

    - name: Build merged config
      shell: bash
      env:
        LIVEKIT_CONFIG_OVERLAY: ${{ inputs.config }}
      run: |
        set -u
        printf '%s' "$LIVEKIT_CONFIG_OVERLAY" > "$RUNNER_TEMP/overlay.yaml"
        yq ea '. as $item ireduce ({}; . * $item)' \
          "$GITHUB_ACTION_PATH/resources/base-config.yaml" "$RUNNER_TEMP/overlay.yaml" \
          > "$RUNNER_TEMP/livekit.yaml"
        echo "::group::Merged LiveKit config"
        cat "$RUNNER_TEMP/livekit.yaml"
        echo "::endgroup::"

    - name: Run server
      id: start
      shell: bash
      run: |
        set -euo pipefail
        if [ -x "$RUNNER_TEMP/livekit-server" ]; then
          livekit_cmd="$RUNNER_TEMP/livekit-server"
        elif [ -f "$RUNNER_TEMP/livekit-server.exe" ]; then
          livekit_cmd="$RUNNER_TEMP/livekit-server.exe"
        elif command -v livekit-server >/dev/null 2>&1; then
          livekit_cmd="livekit-server"
        else
          echo "::error::livekit-server binary not found"
          exit 1
        fi

        "$livekit_cmd" --version

        "$livekit_cmd" --config "$RUNNER_TEMP/livekit.yaml" --dev > "$RUNNER_TEMP/livekit.jsonl" 2>&1 &
        pid=$!
        echo "Running server in the background: pid=$pid"
        echo "pid=$pid" >> "$GITHUB_OUTPUT"
        echo "log-path=$RUNNER_TEMP/livekit.jsonl" >> "$GITHUB_OUTPUT"

    - name: Health check
      shell: bash
      run: |
        set -u
        for i in $(seq 1 10); do
          if [ "$(curl -fsS http://localhost:7880/ || true)" = "OK" ]; then
            echo "Server passed health check"
            exit 0
          fi
          echo "Waiting for server... (retry $i/10)"
          sleep 1
        done
        echo "::error::Server did not pass health check"
        exit 1
